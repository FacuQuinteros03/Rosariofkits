# Va en el repo privado rosariofkits-backup, como .github/workflows/puente.yml.
# Cada 20 minutos, de 9 a 1 de la mañana (hora de Argentina): copia al libro viejo las
# ventas cargadas en /admin, para que la web de producción descuente el stock.
# Se borra el día del corte, cuando la web pasa a leer del ERP.
# Si algo falla (por ejemplo, un SKU que no existe en el libro viejo), GitHub manda mail.
name: Puente ERP -> libro viejo

on:
  schedule:
    # 12:00-03:59 UTC = 9:00-0:59 de Argentina. Cada corrida gasta ~1 minuto de los 2.000
    # gratis por mes de un repo privado: 48 por día dan ~1.450 al mes.
    - cron: "*/20 12-23,0-3 * * *"
  workflow_dispatch: {}   # para correrlo a mano desde la pestaña Actions

permissions:
  contents: read

concurrency:
  group: puente
  cancel-in-progress: false

jobs:
  puente:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: SUPABASE_DB_URL
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: puente_ventas.py

      - name: Copiar ventas al libro viejo
        run: |
          pip install -q "psycopg[binary]" google-auth google-api-python-client
          python puente_ventas.py
